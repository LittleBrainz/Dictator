name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test, publish, stage, and verify the actual package
        id: package
        shell: pwsh
        run: |
          ./packaging/scripts/Build.ps1
          $identity = Get-Content artifacts/Dictator/lib/build-info.json -Raw | ConvertFrom-Json
          "artifact_name=Dictator v$($identity.productVersion)" >> $env:GITHUB_OUTPUT
      - name: Report native widget appearance evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/test-results/widget/*.png -ErrorAction SilentlyContinue | ForEach-Object {
            $image = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Host "WIDGET_PNG:$($_.BaseName):$image"
          }
      - name: Upload test and packaging evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Phase2-test-results
          path: |
            artifacts/test-results/
            artifacts/native/Testing/Temporary/LastTest.log
            artifacts/publish-manifest.txt
            artifacts/package smoke with spaces*/*.json
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload one-extraction application
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: artifacts/Dictator/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
